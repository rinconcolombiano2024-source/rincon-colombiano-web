
name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: https://rinconcolombiano.pl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check lockfile and bootstrap when missing
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            echo "::warning title=Lockfile missing::Generating a temporary package-lock.json. Commit the generated artifact to the repository."

            npm install --package-lock-only --ignore-scripts --no-audit --no-fund

            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload temporary lockfile for repository commit
        if: ${{ always() && steps.lockfile.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
