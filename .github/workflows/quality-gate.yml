
name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: https://rinconcolombiano.pl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Require committed dependency lockfile
        run: test -s package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject high severity production dependency advisories
        # Do not suppress findings. NPM's audit API has returned 400 and
        # timed out in CI despite npm ci succeeding. Only transport failures
        # use an independent, stricter OSV scan of the committed lockfile.
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            audit_log="$(mktemp)"
            if npm audit --omit=dev --audit-level=high --fetch-retries=0 --fetch-timeout=10000 >"$audit_log" 2>&1; then
              cat "$audit_log"
              rm -f "$audit_log"
              exit 0
            fi
            cat "$audit_log"
            if ! grep -Eq 'audit network timeout|audit endpoint returned an error|audit 400 Bad Request' "$audit_log"; then
              echo "::error::NPM reported dependency findings or a non-transport failure; fail closed."
              rm -f "$audit_log"
              exit 1
            fi
            rm -f "$audit_log"
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::NPM advisory endpoint unreachable; retrying once."
              sleep 5
            fi
          done
          echo "::warning::NPM audit unavailable; enforce independent OSV vulnerability scan."
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            -o "$RUNNER_TEMP/osv-scanner"
          chmod 755 "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version
          # The existing NPM security policy scans production only
          # (--omit=dev). OSV's group-aware dev-only exemption preserves
          # the SAME scope while still failing on any prod vulnerability.
          cat > "$RUNNER_TEMP/osv-production.toml" <<'OSV_CONFIG'
          [[PackageOverrides]]
          group = "dev"
          ignore = true
          reason = "Mirror npm audit --omit=dev; exclude only dev-only dependencies"
          OSV_CONFIG
          # Findings, missing packages, unavailable OSV service, and scan
          # errors all remain blocking; no unconditional success fallback.
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile=package-lock.json --config="$RUNNER_TEMP/osv-production.toml"

      - name: Validate media slot schema and security
        run: node scripts/check-brand-slots.mjs

      - name: Verify official customer-page logo, accessible fallback and responsive headers
        run: node scripts/check-public-header-branding.mjs

      - name: Verify administrative photo permissions
        run: node --experimental-strip-types scripts/check-brand-roles.mjs

      - name: Verify secure RC ORDERA server and public URL origins
        run: node --experimental-strip-types scripts/test-rc-ordera-origins.mjs

      - name: Reject unsafe Web, SEO and Supabase public origins
        run: node --experimental-strip-types scripts/test-public-origins.mjs

      - name: Protect RC ORDERA menu shape and product images
        run: node --experimental-strip-types scripts/check-rc-menu-editor.mjs

      - name: Reject invented free prices and invalid availability in public RC ORDERA catalog
        run: node --experimental-strip-types scripts/test-rc-ordera-catalog-safety.mjs

      - name: Guarantee unique multilingual menu category links and targets
        run: node --experimental-strip-types scripts/test-menu-category-anchors.mjs

      - name: Preserve Lechona Tolimense name in PL ES EN while keeping RC ORDERA IDs prices and stations
        run: node --experimental-strip-types scripts/test-lechona-tolimense.mjs

      - name: Protect native CEO shortcuts and restaurant owner editor
        run: node scripts/check-ceo-desktop.mjs

      - name: Verify CEO launch gate honesty
        run: node --experimental-strip-types scripts/check-launch-readiness.mjs

      - name: Bound CEO Supabase diagnostics concurrency
        run: node --experimental-strip-types scripts/check-ceo-probe-bounds.mjs

      - name: Verify editable home and SEO content
        run: node --experimental-strip-types scripts/check-home-editor.mjs

      - name: Verify customer wording and real social SEO previews
        run: node scripts/check-commercial-social-seo.mjs

      - name: Prevent misleading customer and loyalty copy
        run: node scripts/check-commercial-copy.mjs

      - name: Guard Rincón AI mobile safe positioning
        run: node scripts/check-rincon-ai-mobile.mjs

      - name: Verify useful Rincón AI price and opening-hour answers in three languages
        run: node --experimental-strip-types scripts/test-rincon-ai-commercial-intents.mjs

      - name: Keep web payment provider credentials in RC ORDERA
        run: node scripts/check-web-payments-boundary.mjs

      - name: Block unsafe Vercel staging targets
        run: node scripts/test-vercel-preview.mjs

      - name: Verify production-safe manual release workflow
        run: node scripts/check-vercel-release.mjs

      - name: Enforce safe deploy-revision metadata
        run: node --experimental-strip-types scripts/test-release-fingerprint.mjs

      - name: Verify CEO only trusts official domain with matching deployed Git SHA
        run: node --experimental-strip-types scripts/test-official-domain-revision.mjs

      - name: Test integrated IA engine and restaurant chat
        run: |
          npm --prefix apps/ia test
          node --test scripts/test-native-restaurant-chat.mjs scripts/check-order-channels.mjs
          node --experimental-strip-types --test scripts/test-chat-payload.mjs

      - name: Verify private analytics reporting and failure handling
        run: node --experimental-strip-types --test scripts/test-analytics-reports.mjs

      - name: Verify safe assistant links and analytics exports
        run: node --experimental-strip-types --test scripts/test-answer-links.mjs scripts/test-analytics-export.mjs

      - name: Verify browser security configuration
        run: npm run test:security-config

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Smoke test public website, marketing guard and admin PWA
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/rc-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/admin/manifest.webmanifest > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/rc-next.log
            exit 1
          fi

          node scripts/smoke-deployment-revision.mjs http://127.0.0.1:3100 "$GITHUB_SHA"
          node scripts/smoke-locale-routing.mjs http://127.0.0.1:3100
          node scripts/smoke-admin-pwa.mjs http://127.0.0.1:3100
          node scripts/smoke-public.mjs http://127.0.0.1:3100
          node scripts/smoke-live-guest-journey.mjs http://127.0.0.1:3100
          node scripts/smoke-navigation.mjs http://127.0.0.1:3100
          node scripts/smoke-sumup-catalog-migration.mjs http://127.0.0.1:3100

  preview-seo:
    name: Verify non-indexable Vercel-style preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: https://rinconcolombiano.pl
      VERCEL_ENV: preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build preview as Next.js production optimized output
        run: npm run build

      - name: Validate preview robots, noindex, canonicals and public navigation
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3101 > /tmp/rc-preview-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3101/admin/manifest.webmanifest > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/rc-preview-next.log
            exit 1
          fi

          node scripts/smoke-deployment-revision.mjs http://127.0.0.1:3101 "$GITHUB_SHA"
          node scripts/smoke-locale-routing.mjs http://127.0.0.1:3101
          node scripts/smoke-admin-pwa.mjs http://127.0.0.1:3101
          node scripts/smoke-public.mjs http://127.0.0.1:3101 --preview
          node scripts/smoke-live-guest-journey.mjs http://127.0.0.1:3101
          node scripts/smoke-navigation.mjs http://127.0.0.1:3101 --preview
          node scripts/smoke-sumup-catalog-migration.mjs http://127.0.0.1:3101
