name: One-time lockfile generation

on:
  push:
    branches:
      - chore/reproducible-lockfile-20261012

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'rinconcolombiano2024-source/rincon-colombiano-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate lock without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: pin resolved npm dependency graph"
          git push origin "HEAD:chore/reproducible-lockfile-20261012"
