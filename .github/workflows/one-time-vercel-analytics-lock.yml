name: One-time Vercel Analytics lockfile update
on:
  push:
    branches:
      - feat/opt-in-vercel-web-analytics-20261023
    paths:
      - package.json
      - .github/workflows/one-time-vercel-analytics-lock.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'rinconcolombiano2024-source/rincon-colombiano-web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up reviewed Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Generate lockfile without running package scripts
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").dependencies["@vercel/analytics"]')" = "2.0.1"
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit --fetch-retries=3
          test "$(node -p 'require("./package-lock.json").packages["node_modules/@vercel/analytics"].version')" = "2.0.1"
          test "$(node -p 'require("./package-lock.json").packages["node_modules/next"].version')" = "16.4.2"
          test "$(node -p 'require("./package-lock.json").packages["node_modules/eslint-config-next"].version')" = "16.4.2"
      - name: Commit only the generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(analytics): lock verified Vercel Analytics 2.0.1"
          git push origin HEAD:feat/opt-in-vercel-web-analytics-20261023
