name: Build Rincón CEO Windows App

on:
  # El ejecutable STAGING incorpora GITHUB_SHA y exige paridad con
  # /release.json. Compilar en CADA push a main evita distribuir un CEO
  # con revision vieja cuando cambian solo paginas, SEO o CMS.
  push:
    branches:
      - main
      - feat/ceo-desktop-windows-download-20261012
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/windows-ceo-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceo-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10 LTS
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore desktop/RinconColombianoAdmin/RinconColombianoAdmin.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

      - name: Compile self-contained CEO app
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "RinconCEO-win-x64"
          dotnet publish desktop/RinconColombianoAdmin/RinconColombianoAdmin.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $destination /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop publish failed" }
          if (-not (Test-Path (Join-Path $destination "RinconColombianoAdmin.exe"))) { throw "CEO executable missing" }
          Copy-Item desktop/README-WINDOWS.md (Join-Path $destination "LEEME-CEO.txt")
          (Get-FileHash (Join-Path $destination "RinconColombianoAdmin.exe") -Algorithm SHA256).Hash | Out-File -Encoding utf8 (Join-Path $destination "SHA256.txt")
          Write-Host "Windows CEO app built successfully"

      - name: Upload downloadable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RinconColombiano-CEO-Windows-x64
          path: ${{ runner.temp }}/RinconCEO-win-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      # The production binary remains pinned to rinconcolombiano.pl.
      # This separately named test binary is pinned to the actual Web Vercel
      # project alias and cannot be retargeted through flags or env vars.
      - name: Compile isolated CEO staging app for pre-domain acceptance
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "RinconCEO-staging-win-x64"
          if (-not $env:GITHUB_SHA -or $env:GITHUB_SHA.Length -ne 40 -or $env:GITHUB_SHA -match '[^0-9a-fA-F]') { throw "GitHub SHA invalid for staging release parity" }
          dotnet publish desktop/RinconColombianoAdmin/RinconColombianoAdmin.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $destination /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false /p:DefineConstants=RC_CEO_STAGING /p:AssemblyName=RinconColombianoCEOStaging /p:InformationalVersion=$env:GITHUB_SHA /p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw "Windows CEO staging publish failed" }
          $exe = Join-Path $destination "RinconColombianoCEOStaging.exe"
          if (-not (Test-Path $exe)) { throw "CEO staging executable missing" }
          Copy-Item desktop/README-WINDOWS.md (Join-Path $destination "LEEME-CEO-PRUEBAS.txt")
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File -Encoding utf8 (Join-Path $destination "SHA256.txt")
          Write-Host "Isolated Vercel staging CEO executable built with exact Git revision. No domain change."

      - name: Upload separately labeled staging CEO application
        uses: actions/upload-artifact@v4
        with:
          name: RinconColombiano-CEO-Windows-STAGING-x64
          path: ${{ runner.temp }}/RinconCEO-staging-win-x64/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
